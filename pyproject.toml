[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "member-reader"
dynamic = ["version"]
description = "Read, validate, filter and export member records stored as CSV."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "RanaAI-shipping" }]
keywords = ["csv", "members", "validation", "export"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
member-reader = "member_reader.cli:main"

[project.urls]
Homepage = "https://github.com/RanaAI-shipping/member-reader"
Issues = "https://github.com/RanaAI-shipping/member-reader/issues"
Changelog = "https://github.com/RanaAI-shipping/member-reader/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/member_reader/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
